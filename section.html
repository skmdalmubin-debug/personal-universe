<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al Mubin</title><link rel="stylesheet" href="style.css?v=6"><link rel="stylesheet" href="fx.css?v=1">
</head><body>
<div id="s"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=5"></script><script src="common.js?v=6"></script><script src="editor.js?v=1"></script>
<script>
const t = new URLSearchParams(location.search).get("t"), s = $("s");
let rows = [], cat = "", IT;
function draw() {
  const list = cat ? rows.filter(r => r.category === cat) : rows;
  let body = "";
  if (t === "journal") {
    let y = "";
    list.forEach(r => { const yr = r.written_on ? r.written_on.slice(0, 4) : ""; if (yr !== y) { y = yr; body += `${body ? "</div>" : ""}<div class="yr">${esc(y)}</div><div class="jlist">`; } body += entry(t, r); });
    body = body ? body + "</div>" : "";
  } else { const lay = ((REG.find(r => r.key === t) || {}).config || {}).layout || ({ collections: "grid", achievements: "grid", memories: "grid" })[(REG.find(r => r.key === t) || {}).type] || "magazine"; body = `<div class="${{ grid: "cgrid", list: "jlist" }[lay] || ""}">${list.map((r, i) => (LAY[lay] || mag)(t, r, i, 0)).join("")}</div>`; }
  IT.innerHTML = body;
}
(async () => {
  const [p, sps] = await Promise.all([loadProfile(), loadSections()]);
  if (!MAP[t]) { buildNav(p, false, sps); s.innerHTML = '<div class="dwrap"><p class="empty">Not found.</p></div>'; return; }
  const sp = sps[t] || {}, cover = safeUrl(sp.cover_url), title = sp.title || MAP[t].label, ss = sp.styles || {};
  buildNav(p, !!cover, sps);
  document.title = title;
  const { data, error } = await query(t);
  rows = data || [];
  const cats = t === "collections" ? [...new Set(rows.map(r => r.category).filter(Boolean))] : [];
  s.innerHTML = coverHero(cover) + `<div class="dwrap${cover ? " afterhero" : ""}">` +
    (cover ? `<div class="dintro"><h1 class="dt"${sty(ss.title)}>${esc(title)}</h1>${sp.description ? `<div class="dtext"${sty(ss.description)}>${esc(sp.description)}</div>` : ""}</div>` : `<h2${sty(ss.title)}>${esc(title)}</h2>${sp.description ? `<p class="dtext" style="margin:-24px 0 40px;max-width:760px"${""}>${esc(sp.description)}</p>` : ""}`) +
    (cats.length > 1 ? `<div class="chips" id="chips"><button class="on" data-c="">All</button>${cats.map(c => `<button data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : "") +
    `<div id="items"></div></div>`;
  IT = $("items"); IT.id = t;
  wireZoom(s, []);
  if (error || !rows.length) { IT.innerHTML = '<p class="empty">Coming soon.</p>'; return; }
  $("chips")?.querySelectorAll("button").forEach(b => b.onclick = () => { cat = b.dataset.c; document.querySelectorAll("#chips button").forEach(x => x.classList.toggle("on", x === b)); draw(); });
  draw();
})();
</script><script src="fx.js?v=1"></script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lost in space</title>
<style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:var(--b,#05060d);color:var(--f,#f2f2f6);overflow:hidden;position:relative}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(90,110,255,.2),transparent 55%),radial-gradient(1px 1px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 70% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff,transparent),radial-gradient(1px 1px at 88% 15%,#fff,transparent);opacity:var(--s,1)}
main{position:relative;max-width:520px}h1{font-size:clamp(90px,26vw,200px);font-weight:100;letter-spacing:-.06em;line-height:1;background:linear-gradient(180deg,var(--a,#fff),transparent 120%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:clamp(22px,5vw,34px);font-weight:500;margin:6px 0 10px}p{opacity:.7;line-height:1.7}a{display:inline-block;margin-top:26px;padding:13px 28px;border-radius:980px;background:var(--a,#fff);color:var(--b,#05060d);text-decoration:none;font-weight:600}
.astro{width:84px;margin:0 auto 6px;display:block;animation:f 6s ease-in-out infinite}@keyframes f{50%{transform:translateY(-14px) rotate(10deg)}}</style></head><body>
<main id="m"><h1>404</h1></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script>
<script>
const D = { title: "Lost in space", message: "The page you are looking for drifted away. Let me take you back.", button: "Take me home", theme: "dark" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const A = '<svg class="astro" viewBox="0 0 64 80"><rect x="14" y="30" width="36" height="34" rx="12" fill="#e9ecf5"/><rect x="8" y="34" width="10" height="22" rx="5" fill="#cfd5e6"/><rect x="46" y="34" width="10" height="22" rx="5" fill="#cfd5e6"/><circle cx="32" cy="22" r="17" fill="#f4f6fb"/><ellipse cx="32" cy="22" rx="11" ry="9" fill="#1b2442"/><rect x="22" y="62" width="8" height="14" rx="4" fill="#cfd5e6"/><rect x="34" y="62" width="8" height="14" rx="4" fill="#cfd5e6"/></svg>';
function draw(n) { n = Object.assign({}, D, n || {}); const L = n.theme === "light"; const r = document.documentElement.style;
  if (L) { document.body.style.setProperty("--b", "#f6f5f1"); document.body.style.setProperty("--f", "#1d1d1f"); document.body.style.setProperty("--a", "#1d1d1f"); document.body.style.setProperty("--s", "0"); }
  $("m").innerHTML = `${L ? "" : A}<h1>404</h1><h2>${esc(n.title)}</h2><p>${esc(n.message)}</p><a href="/">${esc(n.button)}</a>`; document.title = n.title; }
const $ = id => document.getElementById(id);
draw(new URLSearchParams(location.search).get("preview") ? JSON.parse(sessionStorage.getItem("nfp") || "{}") : null);
if (!new URLSearchParams(location.search).get("preview") && window.supabase) supabase.createClient(SUPABASE_URL, SUPABASE_KEY).from("profile").select("nf").eq("id", 1).maybeSingle().then(({ data }) => draw(data && data.nf));
</script></body></html>

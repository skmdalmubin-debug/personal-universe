<style>
:root{color-scheme:light;--bg:#fff;--fg:#1d1d1f;--mut:#86868b;--line:#e8e8ed;--soft:#f5f5f7;--r:24px;--ratio:4/5;--blue:#0066cc}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%}a{color:inherit}
/* nav + logo */
.nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px clamp(16px,4vw,40px);color:#fff;transition:background .3s,color .3s,box-shadow .3s}
.nav.solid{background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.logo{flex:none;display:flex;align-items:center;text-decoration:none;font-weight:600;letter-spacing:-.01em;min-height:36px}
.logo img{display:block;width:auto;max-width:42vw;object-fit:contain}
.links{display:flex;gap:clamp(14px,2.4vw,30px);font-size:13px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;min-width:0}
.links::-webkit-scrollbar{display:none}.links a{text-decoration:none;opacity:.8}.links a:hover{opacity:1}
/* hero */
.hero{position:relative;height:100vh;height:100svh;min-height:460px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(20px,6vw,80px) clamp(40px,9vh,100px);color:#fff;background:#1d1d1f;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,.05) 60%,rgba(0,0,0,.22))}
.hero>*:not(img){position:relative;z-index:1;width:100%}
.hero.noimg{background:var(--bg);color:var(--fg);justify-content:center;text-align:center}.hero.noimg:after{display:none}
.hero h1{font-size:clamp(46px,10vw,120px);font-weight:600;letter-spacing:-.04em;line-height:1.02}
.hero .tag{font-size:clamp(18px,3vw,30px);margin-top:14px;opacity:.95;line-height:1.3}
.hero .cap{font-size:clamp(14px,1.6vw,17px);margin-top:12px;opacity:.88}
/* sections */
section{padding:clamp(64px,11vw,120px) clamp(16px,4vw,24px) 24px;max-width:1180px;margin:0 auto;scroll-margin-top:56px}
h2{font-size:clamp(30px,5vw,56px);font-weight:600;letter-spacing:-.03em;margin-bottom:clamp(32px,6vw,64px);line-height:1.1}
.empty{color:var(--mut);font-size:15px}
footer{padding:80px 24px;text-align:center;color:var(--mut);font-size:13px}
.seemore{display:block;text-align:center;margin:-6px 0 40px;font-size:clamp(17px,2.4vw,22px);font-weight:500;color:var(--blue);text-decoration:none}
/* magazine zig-zag (same proportions on phone and desktop) */
.mag,.sub{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(16px,5vw,72px);align-items:center;text-decoration:none}
.mag{margin-bottom:clamp(44px,9vw,110px)}
.sub{margin:clamp(36px,8vw,100px) 0}
.mag.flip .pic,.sub.flip .pic{order:2}
.pic{aspect-ratio:var(--ratio);border-radius:var(--r);overflow:hidden;background:var(--soft)}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s ease;cursor:zoom-in}
.mag .pic img{cursor:pointer}.mag:hover .pic img{transform:scale(1.03)}
.mag .meta,.dintro .meta{font-size:clamp(10px,1.2vw,13px);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.mag h3{font-size:clamp(20px,4vw,48px);font-weight:600;letter-spacing:-.03em;line-height:1.12;margin:clamp(6px,1vw,12px) 0 clamp(8px,1.6vw,18px)}
.mag p,.sub .cap{color:var(--mut);font-size:clamp(13px,1.2vw + 7px,17px);white-space:pre-wrap;line-height:1.6}
.mag p{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.sub .cap{color:var(--fg)}
.mag .more{display:inline-block;margin-top:clamp(10px,2vw,24px);font-size:clamp(12px,1.4vw,15px);color:var(--blue)}
.mag.peek{max-height:clamp(200px,34vw,300px);overflow:hidden;margin-bottom:0;-webkit-mask-image:linear-gradient(#000 15%,transparent 92%);mask-image:linear-gradient(#000 15%,transparent 92%)}
.mag.peek .pic,.mag.peek .txt{filter:blur(5px)}
/* collection grid */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(24px,4vw,48px) clamp(14px,2.4vw,28px)}
.ccard{text-decoration:none;display:block}
.cpic{aspect-ratio:var(--ratio);border-radius:var(--r);overflow:hidden;background:var(--soft);margin-bottom:clamp(10px,1.6vw,18px)}
.cpic img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}.ccard:hover .cpic img{transform:scale(1.04)}
.chip{display:inline-block;font-size:clamp(9px,1vw,11px);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);padding:2px 9px;border-radius:980px;margin-bottom:8px}
.ccard h3{font-size:clamp(15px,2vw,21px);font-weight:600;letter-spacing:-.015em;line-height:1.25}
.ccard p{font-size:clamp(12px,1.2vw,15px);color:var(--mut);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard.peek{max-height:clamp(220px,34vw,360px);overflow:hidden;-webkit-mask-image:linear-gradient(#000 20%,transparent 95%);mask-image:linear-gradient(#000 20%,transparent 95%)}
.ccard.peek .cpic,.ccard.peek h3,.ccard.peek p,.ccard.peek .chip{filter:blur(5px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-24px 0 40px}.chips button{font-size:14px}
@media(max-width:640px){.cgrid{grid-template-columns:repeat(2,1fr)}}
/* journal list */
.jlist{border-top:1px solid var(--fg)}
.jrow{display:grid;grid-template-columns:clamp(70px,12vw,150px) 1fr clamp(56px,10vw,120px);gap:clamp(12px,3vw,32px);align-items:start;padding:clamp(20px,3.4vw,36px) 0;border-bottom:1px solid var(--line);text-decoration:none}
.jdate{font-size:clamp(11px,1.2vw,13px);color:var(--mut);letter-spacing:.04em;padding-top:8px}
.jmain h3{font-size:clamp(17px,3vw,34px);font-weight:600;letter-spacing:-.025em;line-height:1.2;transition:color .2s}.jrow:hover h3{color:var(--blue)}
.jmain p{color:var(--mut);margin-top:8px;font-size:clamp(13px,1.2vw + 6px,17px);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.jmeta{display:inline-block;margin-top:10px;font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.jthumb{aspect-ratio:1;border-radius:calc(var(--r)/2);overflow:hidden;background:var(--soft)}.jthumb img{width:100%;height:100%;object-fit:cover}
.jrow.peek{max-height:clamp(120px,20vw,200px);overflow:hidden;-webkit-mask-image:linear-gradient(#000 10%,transparent 95%);mask-image:linear-gradient(#000 10%,transparent 95%)}
.jrow.peek .jmain,.jrow.peek .jthumb{filter:blur(5px)}
.yr{font-size:13px;letter-spacing:.1em;color:var(--mut);margin:56px 0 12px;font-weight:600}
/* about */
.ab{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,6vw,80px);align-items:stretch}
.ab>div:not(.abpic){display:flex;flex-direction:column;justify-content:center}
.bm{color:var(--blue);text-decoration:none;font-weight:500;white-space:nowrap}
.ab.right .abpic{order:2}
.abpic{height:var(--abh,60vh);border-radius:var(--abr,24px);overflow:hidden;background:var(--soft);align-self:var(--abv,center)}
.abpic img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ab .eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.ab h3{font-size:clamp(26px,4vw,46px);font-weight:600;letter-spacing:-.03em;line-height:1.12;margin:12px 0 20px}
.ab .bio{white-space:pre-wrap;color:var(--fg);opacity:.85}
.facts{margin-top:28px;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.facts dt{color:var(--mut)}.facts dd{margin:0}
.docs{margin-top:clamp(56px,9vw,100px)}
.docs h3{font-size:clamp(22px,3vw,32px);font-weight:600;letter-spacing:-.02em;margin-bottom:28px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(130px,22vw,220px),1fr));gap:24px 16px}
.dgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:calc(var(--r)/1.6);background:var(--soft);cursor:zoom-in;display:block}
.dgrid figcaption{font-size:13px;color:var(--mut);margin-top:8px;white-space:pre-wrap}
@media(max-width:700px){.ab{grid-template-columns:1fr}.ab.right .abpic{order:0}.abpic{height:min(var(--abh,60vh),115vw)}.facts div{grid-template-columns:100px 1fr}}
/* detail / section pages */
.chero{height:100vh;height:100svh;min-height:420px;background:var(--soft)}
.chero img{width:100%;height:100%;object-fit:cover;display:block;max-width:none;cursor:zoom-in}
.dwrap{max-width:1100px;margin:0 auto;padding:clamp(88px,12vw,120px) clamp(16px,4vw,24px) 120px}
.dwrap.afterhero{padding-top:clamp(36px,6vw,64px)}
.dintro{max-width:760px;margin:0 auto clamp(24px,4vw,48px)}
.dintro .dt{margin:8px 0 18px}
.dt{font-size:clamp(30px,6vw,64px);font-weight:600;letter-spacing:-.035em;line-height:1.06}
.dtext{white-space:pre-wrap;font-size:clamp(15px,1.4vw + 8px,19px);line-height:1.75}
.back{display:inline-block;margin-bottom:28px;font-size:15px;color:var(--blue);text-decoration:none}
.article{max-width:700px;margin:0 auto}
.article .dt{margin:6px 0 16px}
.article .by{color:var(--mut);font-size:14px;margin-bottom:36px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.article .dcover{width:100%;border-radius:var(--r);margin-bottom:40px;cursor:zoom-in}
.article .dtext{font-size:clamp(16px,1.2vw + 10px,20px);line-height:1.85}
.article figure{margin-top:40px}.article figure img{width:100%;border-radius:var(--r);cursor:zoom-in;display:block}
.article figcaption{font-size:14px;color:var(--mut);margin-top:10px;white-space:pre-wrap}
.lb{position:fixed;inset:0;background:rgba(255,255,255,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60;padding:20px}
.lb.on{display:flex}.lb img{max-width:100%;max-height:82%;border-radius:12px}.lb p{color:var(--mut);font-size:15px;text-align:center;white-space:pre-wrap}
/* contact */
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(28px,6vw,64px)}
.contact h3{font-size:clamp(22px,3vw,28px);font-weight:600;letter-spacing:-.02em;margin-bottom:20px}
.clist{display:grid;gap:12px}
.cc{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;text-decoration:none;transition:background .2s}a.cc:hover{background:var(--soft)}
.ci{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}.ci svg{width:22px;height:22px}
.cx{min-width:0}.cx b{display:block;font-weight:600;font-size:15px}.cx small{display:block;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:700px){.contact{grid-template-columns:1fr}}
/* forms + admin */
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 120px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:9px 18px;border-radius:980px;cursor:pointer}
button.on,button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}button.del{color:#d70015}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
input[type=color]{height:46px;padding:4px}textarea{min-height:130px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:18px 0 6px}
label.chk{display:flex;gap:10px;align-items:center}label.chk input{width:auto}
.item{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.item b{flex:1;font-weight:500}.item small{color:var(--mut)}
.msgbox{padding:16px 0;border-top:1px solid var(--line)}.msgbox p{white-space:pre-wrap;margin:6px 0 10px}.msgbox small{color:var(--mut)}
.pv{width:96px;height:72px;object-fit:cover;border-radius:10px;margin-top:8px;display:block;background:var(--soft)}
.msg{font-size:14px;margin-top:14px;color:var(--mut)}.actions{display:flex;gap:10px;margin-top:28px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.gi{display:grid;grid-template-columns:72px 1fr 30px;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.gi img{width:72px;height:54px;object-fit:cover;border-radius:10px}.gi textarea{min-height:64px;padding:9px 12px;font-size:15px}
.gi .x{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);text-align:center;line-height:30px;cursor:pointer}.gi .gs{grid-column:1/-1}
.sted summary{font-size:13px;color:var(--blue);cursor:pointer;margin-top:6px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin-bottom:6px}.sgrid label{margin:10px 0 4px}.sgrid input,.sgrid select{padding:9px 12px;font-size:15px}
.sted .rs{font-size:12px;padding:5px 12px;margin-top:4px}
.hp{position:absolute;left:-9999px}

.rv{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.hero>.clock{position:absolute;top:76px;right:clamp(16px,4vw,40px);width:auto;z-index:2;font-variant-numeric:tabular-nums;font-size:clamp(14px,2vw,20px);letter-spacing:.08em;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.hero.noimg>.clock{text-shadow:none}
.strip{overflow:hidden}.track{display:flex;width:max-content;will-change:transform}
.strip .ccard{flex:none;width:clamp(150px,26vw,280px);margin-right:clamp(14px,2.4vw,28px)}
@supports (color:color-mix(in srgb,red,blue)){:root{--mut:color-mix(in srgb,var(--fg) 50%,var(--bg));--line:color-mix(in srgb,var(--fg) 12%,var(--bg))}.nav.solid{background:color-mix(in srgb,var(--bg) 86%,transparent)}.lb{background:color-mix(in srgb,var(--bg) 97%,transparent)}}
.hero>picture{position:absolute;inset:0;z-index:0;width:100%}.hero>picture img{width:100%;height:100%;object-fit:cover;max-width:none;display:block}
.gi .mv{display:flex;flex-direction:column;gap:6px}.gi .mv div{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);text-align:center;line-height:30px;cursor:pointer;font-size:14px}
.item .mvb{padding:5px 11px}
.clist{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.book{--gbbg:#26221b;--gba:#c9ac7a;--gbp:#ede6d6;--gbi:#3b3124;background:var(--gbbg);color:var(--gba);border-radius:28px;padding:clamp(14px,3vw,28px);max-width:760px;margin:0 auto;text-align:center}
.gbl{font-size:clamp(11px,1.6vw,14px);letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:clamp(12px,2vw,20px)}
.gbframe{border:1.5px solid var(--gba);border-radius:22px;padding:clamp(22px,5vw,48px) clamp(14px,3vw,30px);background:rgba(255,255,255,.06)}
.gbframe svg{width:34px;height:34px;stroke:var(--gba);fill:none;stroke-width:1.8}
.gbframe h3{font-size:clamp(28px,6vw,48px);font-weight:700;letter-spacing:-.02em;margin:12px 0 22px;color:#efe3c8}
.gbframe hr{border:0;border-top:1px solid var(--gba);margin:0 0 22px}.gbframe p{font-size:clamp(12px,2vw,16px);letter-spacing:.08em;text-transform:uppercase}.gbframe small{display:block;margin-top:22px;font-size:12px;letter-spacing:.1em}
.book button{font:inherit;font-weight:600;border:1px solid var(--gba);background:transparent;color:var(--gba);padding:12px 22px;border-radius:980px;cursor:pointer}
.book .gbopen{width:100%;margin-top:16px;background:rgba(255,255,255,.14);border-color:transparent;color:#fff;padding:16px}
.book button:disabled{opacity:.35;cursor:default}

    return `<label>${l}</label><input data-k="${k}" type="${t}" value="${esc(v)}">${hint}${stySlot}`;
  }).join("") + `<div class="actions"><button class="pri" id="save">Save</button>${s.single ? "" : '<button id="cancel">Cancel</button>'}</div><p class="msg" id="m"></p>`;
  if (!s.single) $("cancel").onclick = list;
  main.querySelectorAll("[data-sty]").forEach(ph => { const sk = ph.dataset.sty; ph.appendChild(styleEditor(stys[sk] = Object.assign({}, saved[sk]), ph.dataset.lbl)); });
  main.querySelectorAll("[data-gal]").forEach(ph => ph.appendChild(galEditor(gal[ph.dataset.gal])));
  main.querySelectorAll("[data-subs]").forEach(ph => ph.appendChild(subsEditor(subsS[ph.dataset.subs])));
  main.onclick = e => { const b = e.target.closest("[data-rm]"); if (!b) return; const k = b.dataset.rm; main.querySelector(`[data-k="${k}"]`).value = ""; $("pv-" + k).innerHTML = ""; $("m").textContent = "Photo removed. Press Save."; };
  main.querySelectorAll("[data-up]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return; $("m").textContent = "Uploading…";
    try { const u = await upload(f), k = inp.dataset.up; main.querySelector(`[data-k="${k}"]`).value = u; $("pv-" + k).innerHTML = pvHtml(k, u); $("m").textContent = "Photo ready. Press Save."; }
    catch (e) { $("m").textContent = e.message; }
  });
  $("save").onclick = async () => {
    const o = {};
    main.querySelectorAll("[data-k]").forEach(e => {
      const k = e.dataset.k, t = s.fields.find(f => f.k === k).t;
      o[k] = t === "bool" ? e.checked : t === "number" ? (e.value === "" ? null : +e.value) : (e.value === "" && ["date", "image"].includes(t) ? null : e.value);
    });
    s.fields.filter(f => f.t === "gallery").forEach(f => o[f.k] = gal[f.k]);
    s.fields.filter(f => f.t === "subs").forEach(f => o[f.k] = subsS[f.k]);
    s.fields.filter(f => f.t === "number" && o[f.k] === null).forEach(f => delete o[f.k]);
    if (Object.keys(stys).length) o.styles = Object.assign({}, saved, stys);
    if (s.filter) o.section_key = s.filter;
    if (s.single) { o.id = 1; o.updated_at = new Date().toISOString(); }
    else { if (!s.noreq && !o[s.title]) { $("m").textContent = "Title is required."; return; } if (row[pk]) o[pk] = row[pk]; }
    const { error } = await sb.from(tb).upsert(o);
    if (error) $("m").textContent = error.message; else if (s.single) $("m").textContent = "Saved."; else list();
  };
}
boot();
let _ty = 0; addEventListener("touchstart", e => _ty = e.touches[0].clientY, { passive: true }); addEventListener("touchend", e => { if (scrollY <= 0 && e.changedTouches[0].clientY - _ty > 150) location.reload(); });
</script></body></html>

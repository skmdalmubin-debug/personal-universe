<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Companies & Ventures</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=Cormorant+Garamond:wght@400;600;700&family=Bodoni+Moda:wght@400;600;800&family=Syne:wght@500;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f11;--fg:#f2ede4;--mut:#9a958b;--line:rgba(255,255,255,.12);--acc:#b8924a;--hf:'Playfair Display',serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:300 16px/1.7 Inter,system-ui,sans-serif;transition:background .5s,color .5s}
body.light{--bg:#f6f2ea;--fg:#1b1a17;--mut:#6d675c;--line:rgba(0,0,0,.14)}
a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:0 24px}
h1,h2,h3{font-family:var(--hf);font-weight:600;line-height:1.05}
.eyebrow{letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:var(--acc)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--i,0)*90ms)}
.rv.in{opacity:1;transform:none}
/* list view */
#list{padding:12vh 0 14vh}
#list h2{font-size:clamp(40px,7vw,92px);margin:14px 0 8px}
.lead{color:var(--mut);max-width:520px}
#rail{position:sticky;top:0;z-index:5;display:flex;gap:14px;overflow-x:auto;padding:14px 24px;margin:40px 0 0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);scrollbar-width:none}
#rail button{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--line);color:var(--mut);padding:8px 16px 8px 8px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px;transition:.4s var(--ease)}
#rail button img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#222}
#rail button.on{color:var(--fg);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.row{position:relative;display:grid;grid-template-columns:60px 1.2fr 1fr 110px;gap:24px;align-items:center;padding:42px 0;border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden;min-height:170px;scroll-margin-top:90px}
.row::before{content:"";position:absolute;inset:0;background:var(--cv) center/cover;opacity:0;transform:scale(1.08);transition:.8s var(--ease);filter:grayscale(.4) brightness(.45)}
.row>*{position:relative}.row:hover::before,.row.on::before{opacity:.55;transform:none}
.row .n{font-family:var(--hf);color:var(--acc);font-size:20px}
.row h3{font-size:clamp(28px,4.2vw,56px);font-family:var(--rf);transition:transform .6s var(--ease)}
.row:hover h3{transform:translateX(14px)}
.row .ind{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.row p{color:var(--mut);font-size:15px}.row:hover p,.row.on p{color:var(--fg)}
.row .lg{width:92px;height:92px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#1c1c1c;justify-self:end}
.lgph{width:92px;height:92px;border-radius:50%;border:1px solid var(--acc);display:grid;place-items:center;font-family:var(--hf);font-size:36px;color:var(--acc);justify-self:end}
/* profile */
#prof{display:none;--bg:inherit}
body.open #list{display:none}body.open #prof{display:block}
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:0 0 9vh;overflow:hidden}
.hero .bg{position:absolute;inset:-6% 0;background:var(--cv) center/cover;filter:brightness(.42);transform:translateY(var(--py,0))}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,var(--bg))}
.hero .wrap{position:relative;z-index:2;width:100%}
.hero h1{font-size:clamp(54px,12vw,176px);letter-spacing:-.02em;overflow:hidden;padding-bottom:.08em}
.hero h1 span{display:inline-block;transform:translateY(105%);animation:up 1.2s var(--ease) forwards;animation-delay:calc(var(--i)*60ms+200ms)}
@keyframes up{to{transform:none}}
.hero .meta{display:flex;flex-wrap:wrap;gap:10px 34px;margin-top:20px;color:var(--mut);font-size:14px}
.hero .meta b{color:var(--fg);font-weight:400}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;mix-blend-mode:normal}
.top button{background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(12px);color:var(--fg);border:1px solid var(--line);padding:10px 18px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
.sec{padding:13vh 0;border-top:1px solid var(--line)}
.sec h2{font-size:clamp(34px,5vw,64px);margin:12px 0 28px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.card{border:1px solid var(--line);padding:28px;transition:.5s var(--ease)}
.card:hover{border-color:var(--acc);transform:translateY(-6px)}
.card h3{font-size:24px;margin-bottom:8px}.card p,.big{color:var(--mut)}
.big{font-size:clamp(20px,2.4vw,30px);line-height:1.5;font-family:var(--hf);color:var(--fg);max-width:880px}
.stat{font-family:var(--hf);font-size:clamp(40px,6vw,76px);color:var(--acc);line-height:1}
.tl{border-left:1px solid var(--acc);padding-left:26px;margin-left:6px}
.tl>div{position:relative;padding:0 0 30px}.tl>div::before{content:"";position:absolute;left:-32px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--acc)}
.tl b{font-family:var(--hf);color:var(--acc);font-size:22px;display:block}
.person{display:flex;gap:16px;align-items:flex-start}.av{flex:0 0 56px;height:56px;border-radius:50%;background:var(--acc);color:#111;display:grid;place-items:center;font-family:var(--hf);font-size:22px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:.7s var(--ease)}.gal img:hover{transform:scale(1.03)}
.btn{display:inline-block;margin:6px 10px 6px 0;padding:12px 24px;border:1px solid var(--acc);text-decoration:none;font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:.4s}
.btn:hover{background:var(--acc);color:#111}
@media(max-width:760px){.row{grid-template-columns:36px 1fr 64px}.row p{display:none}.row .lg,.lgph{width:60px;height:60px;font-size:22px}.row>div:nth-child(3){display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.hero h1 span{transform:none}}
/* Structured company divisions / sub-sections */
.company-subsec{padding:clamp(28px,5vw,54px) 0;border-top:1px solid var(--line);margin-top:26px}
.company-subsec h3{font-family:var(--hf);font-size:clamp(26px,4vw,44px);font-weight:500;letter-spacing:-.025em;margin:10px 0 16px}
.company-subsec .big{max-width:850px}
.company-sub-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}
.company-sub-media{margin:0;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.company-sub-media img,.company-sub-media video{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.company-sub-media figcaption{padding:10px 12px;color:var(--mut);font-size:12px}
@media(max-width:640px){.company-sub-gallery{grid-template-columns:1fr}}
</style></head><body>
<main id="list"><div class="wrap">
  <div class="eyebrow rv">Companies &amp; Ventures</div>
  <h2 class="rv" style="--i:1">Built. Owned. Led.</h2>
  <p class="lead rv" style="--i:2">Every venture stands on its own. Choose one to enter its world.</p>
</div>
<nav id="rail" aria-label="Choose a company"></nav>
<div class="wrap" id="rows"><p class="lead" id="msg">Loading…</p></div></main>
<div id="prof"></div>
<script>
/* ===== CONFIG: public (anon) key only — safe in the browser; RLS protects writes ===== */
const SB='https://lorvspsqrgvjearyokyl.supabase.co',KEY='sb_publishable_VMxqhe-SeqZoFnufNExG2g_I0q7uquS';
const FONTS={playfair:"'Playfair Display',serif",cormorant:"'Cormorant Garamond',serif",bodoni:"'Bodoni Moda',serif",syne:"'Syne',sans-serif"};
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines=t=>String(t||'').split('\n').map(s=>s.trim()).filter(Boolean).map(l=>l.split('|').map(p=>p.trim()));
const safeUrl=u=>/^(https?:|mailto:|tel:)/i.test(u||'')?u:'#';
const safeImg=u=>/^https?:\/\//i.test(u||'')?u:'';
let C=[];
const mark=c=>c.logo_url?`<img class="lg" src="${esc(safeImg(c.logo_url))}" alt="" loading="lazy">`:`<div class="lgph">${esc(c.name[0])}</div>`;
function reveal(root){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});root.querySelectorAll('.rv').forEach(el=>io.observe(el))}
function theme(c){document.body.classList.toggle('light',c&&c.theme==='light');const r=document.documentElement.style;
  r.setProperty('--acc',(c&&/^#[0-9a-f]{3,8}$/i.test(c.accent||'')?c.accent:'#b8924a'));r.setProperty('--hf',FONTS[c&&c.font]||FONTS.playfair)}
function renderList(){
  $('#msg')?.remove();
  if(!C.length){$('#rows').innerHTML='<p class="lead">No companies published yet.</p>';return}
  $('#rail').innerHTML=C.map((c,i)=>`<button data-i="${i}">${c.logo_url?`<img src="${esc(safeImg(c.logo_url))}" alt="">`:''}${esc(c.name)}</button>`).join('');
  $('#rows').innerHTML=C.map((c,i)=>`<article class="row rv" id="r${i}" data-id="${esc(c.id)}" style="--i:${i%3};--rf:${FONTS[c.font]||FONTS.playfair};--cv:url('${esc(safeImg(c.cover_url))}')" tabindex="0">
    <span class="n">${String(i+1).padStart(2,'0')}</span>
    <div><span class="ind">${esc(c.industry)}</span><h3>${esc(c.name)}</h3></div>
    <p>${esc(c.intro)}</p>${mark(c)}</article>`).join('');
  document.querySelectorAll('.row').forEach(r=>{const go=()=>{location.hash='company/'+r.dataset.id};r.onclick=go;r.onkeydown=e=>e.key==='Enter'&&go()});
  document.querySelectorAll('#rail button').forEach(b=>b.onclick=()=>$('#r'+b.dataset.i).scrollIntoView({behavior:'smooth',block:'center'}));
  reveal($('#rows'));
  const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=e.target.id.slice(1);document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',r===e.target));
    document.querySelectorAll('#rail button').forEach(b=>{const on=b.dataset.i===i;b.classList.toggle('on',on);if(on)b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})})}}),{rootMargin:'-45% 0px -45% 0px'});
  document.querySelectorAll('.row').forEach(r=>so.observe(r));
}
const sec=(k,t,body,i=0)=>body?`<section class="sec"><div class="wrap"><div class="eyebrow rv">${k}</div><h2 class="rv" style="--i:1">${t}</h2>${body}</div></section>`:'';
const cards=a=>`<div class="cols">${a.map((x,i)=>`<div class="card rv" style="--i:${i%4}"><h3>${esc(x[0])}</h3><p>${esc(x[1]||'')}</p></div>`).join('')}</div>`;
const companySubs=list=>{
  const sections=Array.isArray(list)?list.filter(s=>s&&((s.title||'').trim()||(s.description||'').trim()||(s.images||[]).length)):[];
  if(!sections.length)return '';
  return sec('Company divisions','Inside the organisation',sections.map((s,i)=>{
    const media=(Array.isArray(s.images)?s.images:[]).filter(m=>m&&m.url).map((m,j)=>{
      const url=safeImg(m.url); if(!url)return '';
      const isVideo=m.type==='video'||/\.(mp4|webm|mov)(?:\?|$)/i.test(url);
      const visual=isVideo?`<video src="${esc(url)}" controls playsinline preload="metadata"></video>`:`<img src="${esc(url)}" alt="${esc(m.caption||s.title||'')}" loading="lazy" decoding="async">`;
      return `<figure class="company-sub-media rv" style="--i:${j%3}">${visual}${m.caption?`<figcaption>${esc(m.caption)}</figcaption>`:''}</figure>`;
    }).join('');
    return `<article class="company-subsec"><div class="eyebrow rv">${String(i+1).padStart(2,'0')} / ${sections.length}</div>${s.title?`<h3 class="rv">${esc(s.title)}</h3>`:''}${s.description?`<p class="big rv">${esc(s.description)}</p>`:''}${media?`<div class="company-sub-gallery">${media}</div>`:''}</article>`;
  }).join(''));
};
const extra=t=>String(t||'').split(/^## /m).slice(1).map(b=>{const[h,...r]=b.split('\n');const ps=r.join('\n').trim().split(/\n{2,}/).filter(Boolean);return sec('More',esc(h.trim()),`<div class="rv">${ps.map(p=>`<p class="big" style="margin-bottom:18px">${esc(p)}</p>`).join('')}</div>`)}).join('');
function renderProfile(c){
  theme(c);document.body.classList.add('open');scrollTo(0,0);
  const name=[...c.name].map((ch,i)=>`<span style="--i:${i}">${ch===' '?'&nbsp;':esc(ch)}</span>`).join('');
  const vals=lines(c.values_text),prod=lines(c.products_text),stats=lines(c.market_stats),lead=lines(c.leaders_text),ms=lines(c.milestones_text),lk=lines(c.links_text);
  const imgs=(Array.isArray(c.images)?c.images:[]).map(x=>typeof x==='string'?x:x&&x.url).filter(Boolean);
  $('#prof').innerHTML=`<div class="top"><button id="back">← All ventures</button><button id="nx">Next →</button></div>
  <header class="hero" style="--cv:url('${esc(safeImg(c.cover_url))}')"><div class="bg"></div><div class="wrap">
    <div class="eyebrow">${esc(c.industry)}</div><h1 aria-label="${esc(c.name)}">${name}</h1>
    <p class="big" style="margin-top:14px">${esc(c.intro)}</p>
    <div class="meta">${c.founded?`<span>Founded <b>${esc(c.founded)}</b></span>`:''}${c.location?`<span>Based in <b>${esc(c.location)}</b></span>`:''}${c.website?`<a href="${esc(safeUrl(c.website))}" target="_blank" rel="noopener"><b>Visit website ↗</b></a>`:''}</div></div></header>`
  +sec('01 — Overview','About us',c.about&&`<p class="big rv">${esc(c.about)}</p>`)
  +sec('02 — Purpose','Vision, mission &amp; values',`<div class="cols">${c.vision?`<div class="card rv"><h3>Vision</h3><p>${esc(c.vision)}</p></div>`:''}${c.mission?`<div class="card rv" style="--i:1"><h3>Mission</h3><p>${esc(c.mission)}</p></div>`:''}</div>${vals.length?`<div style="margin-top:22px">${cards(vals)}</div>`:''}`)
  +sec('03 — Offering','Products &amp; services',prod.length&&cards(prod))
  +sec('04 — Engine','Business model',c.model_text&&`<p class="big rv">${esc(c.model_text)}</p>`)
  +sec('05 — Landscape','Market &amp; industry',(c.market_text?`<p class="big rv">${esc(c.market_text)}</p>`:'')+(stats.length?`<div class="cols" style="margin-top:34px">${stats.map((s,i)=>`<div class="rv" style="--i:${i}"><div class="stat">${esc(s[0])}</div><p style="color:var(--mut)">${esc(s[1]||'')}</p></div>`).join('')}</div>`:''))
  +sec('06 — People','Leadership &amp; ownership',(lead.length?`<div class="cols">${lead.map((p,i)=>`<div class="person rv" style="--i:${i}"><div class="av">${esc(p[0][0])}</div><div><h3 style="font-size:22px">${esc(p[0])}</h3><div class="eyebrow">${esc(p[1]||'')}</div><p style="color:var(--mut)">${esc(p[2]||'')}</p></div></div>`).join('')}</div>`:'')+(c.ownership_text?`<p class="rv" style="margin-top:28px;color:var(--mut);max-width:720px">${esc(c.ownership_text)}</p>`:''))
  +sec('07 — Journey','Achievements &amp; milestones',ms.length&&`<div class="tl">${ms.map((m,i)=>`<div class="rv" style="--i:${i%3}"><b>${esc(m[0])}</b><span style="color:var(--mut)">${esc(m[1]||'')}</span></div>`).join('')}</div>`)
  +sec('08 — Horizon','Future plans',c.future_text&&`<p class="big rv">${esc(c.future_text)}</p>`)
  +(imgs.length?sec('Gallery','Inside the company',`<div class="gal">${imgs.map((u,i)=>`<img class="rv" style="--i:${i%3}" src="${esc(safeImg(u))}" alt="" loading="lazy">`).join('')}</div>`):'')
  +companySubs(c.subs)+extra(c.extra_text)
  +sec('09 — Connect','Contact &amp; official links',`<div class="rv">${c.email?`<a class="btn" href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:''}${c.phone?`<a class="btn" href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:''}${lk.map(l=>`<a class="btn" target="_blank" rel="noopener" href="${esc(safeUrl(l[1]))}">${esc(l[0])} ↗</a>`).join('')}${c.address?`<p style="margin-top:18px;color:var(--mut)">${esc(c.address)}</p>`:''}</div>`);
  $('#back').onclick=()=>{location.hash=''};
  const i=C.findIndex(x=>x.id===c.id);$('#nx').onclick=()=>{location.hash='company/'+C[(i+1)%C.length].id};
  reveal($('#prof'));
}
addEventListener('scroll',()=>{const b=document.querySelector('.hero .bg');if(b)document.documentElement.style.setProperty('--py',Math.min(scrollY*.25,300)+'px');b&&(b.style.setProperty('--py',Math.min(scrollY*.25,300)+'px'))},{passive:true});
function route(){const m=location.hash.match(/^#company\/(.+)$/),c=m&&C.find(x=>x.id===m[1]);
  if(c)renderProfile(c);else{document.body.classList.remove('open');theme(null);$('#prof').innerHTML=''}}
fetch(`${SB}/rest/v1/companies?select=*&published=eq.true&order=sort_order.asc,created_at.asc`,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}})
 .then(r=>r.ok?r.json():Promise.reject()).then(d=>{C=d;renderList();route()})
 .catch(()=>{$('#msg').textContent='Could not load companies right now.'});
addEventListener('hashchange',route);
</script></body></html>

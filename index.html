<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al Mubin</title><meta name="description" content="The personal digital world of Al Mubin.">
<link rel="stylesheet" href="style.css">
</head><body>
<nav><a href="#travel">Travel</a><a href="#collections">Collection</a><a href="#journal">Journal</a><a href="#achievements">Achievements</a><a href="#memories">Memories</a></nav>
<header class="hero" id="hero"></header>
<main id="main"></main>
<footer id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="common.js"></script>
<script>
const main = document.getElementById("main");
Object.entries(MAP).forEach(([t, c]) => main.insertAdjacentHTML("beforeend", `<section id="${t}"><h2>${c.label}</h2><div id="c-${t}"></div></section>`));
function mag(t, r, i, off) {
  const c = MAP[t], img = r[c.cover] || (r.images && r.images[0]);
  const flip = (i + off) % 2 === 1, txt = (r[c.text] || "").trim();
  return `<a class="mag${flip ? " flip" : ""}" href="detail.html?t=${t}&id=${esc(r.id)}">
    <div class="pic">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ""}</div>
    <div class="txt"><div class="meta">${esc(c.meta(r))}</div><h3>${esc(r.title)}</h3>${txt ? `<p>${esc(txt)}</p>` : ""}<span class="more">View details ›</span></div></a>`;
}
(async () => {
  const { data: p } = await sb.from("profile").select("*").eq("id", 1).maybeSingle();
  const name = p?.name || "Al Mubin";
  document.title = name;
  document.getElementById("hero").innerHTML = `${p?.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : ""}<h1>${esc(name)}</h1><p class="tag">${esc(p?.tagline)}</p>${p?.bio ? `<p class="bio">${esc(p.bio)}</p>` : ""}`;
  document.getElementById("foot").textContent = `© ${new Date().getFullYear()} ${name}`;
  let off = 0;
  for (const [t, c] of Object.entries(MAP)) {
    const el = document.getElementById("c-" + t), o = off++ % 2;
    try {
      let q = sb.from(t).select("*").eq("published", true);
      c.order.forEach((k, i) => q = q.order(k, { ascending: t !== "journal" && i === 0, nullsFirst: false }));
      const { data, error } = await q;
      if (error) throw error;
      el.innerHTML = data.length ? data.map((r, i) => mag(t, r, i, o)).join("") : '<p class="empty">Coming soon.</p>';
    } catch (e) { el.innerHTML = '<p class="empty">Coming soon.</p>'; }
  }
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
})();
</script></body></html>

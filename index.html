<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al Mubin</title><meta name="description" content="The personal digital world of Al Mubin.">
<link rel="stylesheet" href="style.css">
</head><body>
<nav><a href="#travel">Travel</a><a href="#collections">Collection</a><a href="#journal">Journal</a><a href="#achievements">Achievements</a><a href="#memories">Memories</a><a href="#contact">Contact</a></nav>
<header class="hero" id="hero"></header>
<main id="main"></main>
<footer id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="common.js"></script>
<script>
const main = document.getElementById("main");
Object.entries(MAP).forEach(([t, c]) => main.insertAdjacentHTML("beforeend", `<section id="${t}"><h2>${c.label}</h2><div id="c-${t}"></div></section>`));
main.insertAdjacentHTML("beforeend", '<section id="contact"><h2>Contact</h2><div class="contact" id="contact-box"></div></section>');

function contactView(p) {
  const wa = /^\+?[\d\s-]{6,}$/.test(p.whatsapp || "") ? "https://wa.me/" + p.whatsapp.replace(/\D/g, "") : safeUrl(p.whatsapp);
  const rows = [
    ["Email", p.email, p.email ? "mailto:" + p.email : ""], ["Phone", p.phone, p.phone ? "tel:" + p.phone.replace(/\s/g, "") : ""],
    ["Address", p.address, ""], ["WhatsApp", p.whatsapp && "Message me", wa], ["Instagram", p.instagram && "Instagram", safeUrl(p.instagram)],
    ["Facebook", p.facebook && "Facebook", safeUrl(p.facebook)], ["LinkedIn", p.linkedin && "LinkedIn", safeUrl(p.linkedin)]
  ].filter(r => r[1]);
  document.getElementById("contact-box").innerHTML = `<div><h3>Get in touch</h3><ul>${rows.map(([l, v, h]) => `<li><span>${l}</span>${h ? `<a href="${esc(h)}" target="_blank" rel="noopener">${esc(v)}</a>` : esc(v)}</li>`).join("") || '<li class="empty">Coming soon.</li>'}</ul></div>
  <form id="cf"><h3>Send a message</h3>
    <input name="name" placeholder="Your name" maxlength="100" required style="margin-bottom:12px">
    <input name="email" type="email" placeholder="Your email" maxlength="200" required style="margin-bottom:12px">
    <textarea name="message" placeholder="Message" maxlength="2000" required></textarea>
    <input class="hp" name="website" tabindex="-1" autocomplete="off">
    <div class="actions"><button class="pri" type="submit">Send</button></div><p class="msg" id="cm"></p></form>`;
  document.getElementById("cf").onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    if (f.website.value) return;
    const { error } = await sb.from("messages").insert({ name: f.name.value.trim(), email: f.email.value.trim(), message: f.message.value.trim() });
    document.getElementById("cm").textContent = error ? "Could not send. Please try again." : "Thank you! Your message has been sent.";
    if (!error) f.reset();
  };
}

(async () => {
  const p = await loadProfile(), name = p.name || "Al Mubin", hero = document.getElementById("hero");
  document.title = name;
  const bg = safeUrl(p.hero_url) || safeUrl(p.photo_url);
  hero.className = "hero" + (bg ? "" : " noimg");
  hero.innerHTML = `${bg ? `<img src="${esc(bg)}" alt="">` : ""}<h1>${esc(name)}</h1>${p.tagline ? `<p class="tag">${esc(p.tagline)}</p>` : ""}${p.bio ? `<p class="bio">${esc(p.bio)}</p>` : ""}`;
  document.getElementById("foot").textContent = `© ${new Date().getFullYear()} ${name}`;
  contactView(p);
  let off = 0;
  for (const [t, c] of Object.entries(MAP)) {
    const el = document.getElementById("c-" + t), o = off++ % 2;
    try {
      const { data, error } = await query(t).limit(3);
      if (error) throw error;
      el.innerHTML = data.length
        ? data.slice(0, 2).map((r, i) => mag(t, r, i, o)).join("") + (data.length > 2 ? mag(t, data[2], 2, o, true) + `<a class="seemore" href="section.html?t=${t}">See more ›</a>` : "")
        : '<p class="empty">Coming soon.</p>';
    } catch (e) { el.innerHTML = '<p class="empty">Coming soon.</p>'; }
  }
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
})();
</script></body></html>

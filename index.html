<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al Mubin</title><meta name="description" content="The personal digital world of Al Mubin.">
<link rel="stylesheet" href="style.css?v=4">
</head><body>
<header class="hero noimg" id="hero"></header>
<main id="main"></main>
<footer id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=4"></script><script src="common.js?v=4"></script>
<script>
const main = $("main");
function bioHtml(p, hs) {
  const b = p.about_bio || ""; if (!b) return "";
  const w = b.match(/\S+\s*/g) || [];
  return `<div class="bio"${sty(hs["about.bio"])}>${w.length > 200 ? `<span class="bs">${esc(w.slice(0, 200).join("").trim())}…</span><span class="bf" hidden>${esc(b)}</span> <a href="#" class="bm">See more…</a>` : esc(b)}</div>`;
}
function aboutView(p) {
  const hs = p.styles || {}, docs = (p.about_docs || []).filter(d => d && d.url);
  if (!(p.about_pic || p.about_headline || p.about_bio || p.about_facts || docs.length)) return "";
  const facts = (p.about_facts || "").split("\n").map(l => l.trim()).filter(Boolean).map(l => { const i = l.includes("|") ? l.indexOf("|") : l.indexOf(":"); return i > 0 ? [l.slice(0, i).trim(), l.slice(i + 1).trim()] : ["", l]; });
  const h = Math.min(100, Math.max(50, +p.about_height || 60)), rad = Math.min(80, Math.max(0, Number.isFinite(+p.about_radius) ? +p.about_radius : 24));
  const v = ["start", "center", "end"].includes(p.about_valign) ? p.about_valign : "center", pic = safeUrl(p.about_pic);
  return `<section id="about"><div class="ab${p.about_side === "right" ? " right" : ""}">
    ${pic ? `<div class="abpic" style="--abh:${h}vh;--abr:${rad}px;--abv:${v}"><img class="zoom" src="${esc(pic)}" alt=""></div>` : ""}
    <div><div class="eyebrow"${sty(hs["about.title"])}>${esc(p.about_title || "About me")}</div>
      ${p.about_headline ? `<h3${sty(hs["about.headline"])}>${esc(p.about_headline)}</h3>` : ""}
      ${bioHtml(p, hs)}
      ${facts.length ? `<dl class="facts"${sty(hs["about.facts"])}>${facts.map(([a, b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl>` : ""}</div></div>
    ${docs.length ? `<div class="docs"><h3${sty(hs["about.docs_title"])}>${esc(p.about_docs_title || "Licenses & Credentials")}</h3><div class="dgrid">${docs.map((d, n) => `<figure><img data-n="${n}" src="${esc(d.url)}" alt="" loading="lazy">${d.caption ? `<figcaption${sty(d.style)}>${esc(d.caption)}</figcaption>` : ""}</figure>`).join("")}</div></div>` : ""}</section>`;
}
function contactView(list) { $("contact-box").innerHTML = list.length ? contactCards(list) : '<p class="empty">Coming soon.</p>'; }
const hx = (v, d) => /^#[0-9a-f]{6}$/i.test(v || "") ? v : d, pad = n => String(n).padStart(3, "0");
async function bookView(cfg) {
  const { data } = await sb.from("guestbook").select("*").eq("status", "approved").order("created_at");
  const rows = data || [], el = $("gb"); let i = -1;
  el.className = "book"; el.style.cssText = `--gbbg:${hx(cfg.bg, "#26221b")};--gba:${hx(cfg.accent, "#c9ac7a")};--gbp:${hx(cfg.paper, "#ede6d6")};--gbi:${hx(cfg.ink, "#3b3124")}`;
  const T = (k, d) => esc(cfg[k] || d), top = T("label", "Al Mubin's Personal Archive");
  const nav = (n, mid) => `<div class="gbnav"><button id="gp" ${n <= 0 ? "disabled" : ""}>‹ Previous</button><span>${mid}</span><button id="gn" ${n >= rows.length ? "disabled" : ""}>Next ›</button></div><button class="gbback" id="gc">Back to Cover</button>`;
  const draw = () => {
    if (i < 0) el.innerHTML = `<div class="gbl">${top}</div><div class="gbframe"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><h3>${T("title", "The Guestbook")}</h3><hr><p>${T("subtitle", "A collection of words & memories")}</p><small>${T("est", "EST. " + new Date().getFullYear())}</small></div><button class="gbopen" id="go">${T("button", "Open the Book")}</button>`;
    else if (i < rows.length) { const r = rows[i]; el.innerHTML = `<div class="gbl">${top}</div><div class="gbpage"><div class="gbtop"><span>${T("pagetitle", "Al Mubin's Guestbook")}</span><span>Page ${pad(i + 1)}</span></div><h4>${T("dear", "Dear Mubin,")}</h4><div class="who">${esc(r.name)}${r.location ? "<br>" + esc(r.location) : ""}</div><div class="gbmsg">${esc(r.message)}</div><div class="gbfoot">— ${esc((r.name || "").split(" ")[0])}<br>${esc(fmt(r.created_at))}</div></div>${nav(i, `${i + 1} / ${rows.length}`)}`; }
    else el.innerHTML = `<div class="gbl">${top}</div><div class="gbpage"><div class="gbtop"><span>${T("pagetitle", "Al Mubin's Guestbook")}</span><span>Page ${pad(i + 1)}</span></div><h4>Send your message</h4><form id="gf"><input name="name" placeholder="Your name" maxlength="100" required style="margin-top:16px"><input name="location" placeholder="City, country (optional)" maxlength="100"><textarea name="message" placeholder="Write your message" maxlength="1000" required></textarea><input class="hp" name="website" tabindex="-1" autocomplete="off"><button type="submit">Send</button><p class="msg" id="gm"></p></form></div>${nav(i, "Your page")}`;
    $("go")?.addEventListener("click", () => { i = 0; draw(); }); $("gp")?.addEventListener("click", () => { i--; draw(); }); $("gn")?.addEventListener("click", () => { i++; draw(); }); $("gc")?.addEventListener("click", () => { i = -1; draw(); });
    $("gf")?.addEventListener("submit", async e => { e.preventDefault(); const f = e.target; if (f.website.value) return;
      const { error } = await sb.from("guestbook").insert({ name: f.name.value.trim(), location: f.location.value.trim() || null, message: f.message.value.trim() });
      $("gm").textContent = error ? "Could not send. Please try again." : "Thank you! Your message will appear in the book after approval."; if (!error) f.reset(); });
  };
  draw();
}
(async () => {
  const [p, sp] = await Promise.all([loadProfile(), loadSections()]), hs = p.styles || {};
  const name = p.name || "Al Mubin", bg = safeUrl(p.hero_url) || safeUrl(p.photo_url), hero = $("hero");
  document.title = name;
  buildNav(p, !!bg, sp);
  hero.className = "hero" + (bg ? "" : " noimg");
  const pos = `object-position:${Math.min(100, Math.max(0, +p.hero_fx ?? 50))}% ${Math.min(100, Math.max(0, +p.hero_fy ?? 50))}%`, mob = safeUrl(p.hero_mobile_url);
  hero.innerHTML = `${bg ? (mob ? `<picture><source media="(max-width:700px)" srcset="${esc(mob)}"><img src="${esc(bg)}" alt="" style="${pos}"></picture>` : `<img src="${esc(bg)}" alt="" style="${pos}">`) : ""}<h1${sty(hs["hero.name"])}>${esc(name)}</h1>
    ${p.tagline ? `<p class="tag"${sty(hs["hero.tagline"])}>${esc(p.tagline)}</p>` : ""}
    ${p.hero_cap1 ? `<p class="cap"${sty(hs["hero.cap1"])}>${esc(p.hero_cap1)}</p>` : ""}
    ${p.hero_cap2 ? `<p class="cap"${sty(hs["hero.cap2"])}>${esc(p.hero_cap2)}</p>` : ""}
    ${p.clock_show === false ? "" : '<div class="clock" id="clk"></div>'}`;
  const clk = $("clk"), tz = p.clock_tz && p.clock_tz !== "local" ? p.clock_tz : undefined;
  if (clk) { const tick = () => { try { clk.textContent = new Date().toLocaleTimeString("en-GB", { hour12: false, timeZone: tz }); } catch (e) { clk.textContent = new Date().toLocaleTimeString("en-GB", { hour12: false }); } }; tick(); setInterval(tick, 1000); }
  $("foot").textContent = p.footer_text || `© ${new Date().getFullYear()} ${name}`;
  const vis = REG.filter(s => s.visible), ttl = s => (sp[s.key] && sp[s.key].title) || s.title || (MAP[s.key] && MAP[s.key].label) || s.key;
  main.innerHTML = vis.map(s => s.type === "about" ? aboutView(p) : s.type === "contact" ? '<section id="contact"><h2>Contact</h2><div class="clist" id="contact-box"></div></section>'
    : s.type === "guestbook" ? `<section id="guestbook"><h2>${esc(ttl(s))}</h2><div id="gb"></div></section>` : `<section id="${s.key}"><h2>${esc(ttl(s))}</h2><div id="c-${s.key}" class="${WRAP[s.key] || ""}"></div></section>`).join("");
  const ab = $("about"); if (ab) { const docs = (p.about_docs || []).filter(d => d && d.url); ab.querySelector(".bm")?.addEventListener("click", e => { e.preventDefault(); const f = ab.querySelector(".bf"), s = ab.querySelector(".bs"), open = f.hidden; f.hidden = !open; s.hidden = open; e.target.textContent = open ? "See less" : "See more…"; });
    ab.querySelectorAll(".abpic img").forEach(i => i.onclick = () => openLB(i.src, "")); ab.querySelectorAll(".dgrid img").forEach(i => i.onclick = () => openLB(i.src, (docs[+i.dataset.n] || {}).caption)); }
  if ($("contact-box")) { const { data: cts } = await sb.from("contacts").select("*").eq("published", true).order("sort_order").order("created_at"); contactView(cts || []); }
  const gs = vis.find(s => s.type === "guestbook"); if (gs) bookView(gs.config || {});
  if (!IS_RELOAD && location.hash) $(location.hash.slice(1))?.scrollIntoView();
  let off = 0;
  for (const t of vis.filter(s => MAP[s.key]).map(s => s.key)) {
    const el = $("c-" + t), o = off++ % 2;
    try {
      const { data, error } = await query(t).limit(t === "collections" ? 30 : 3);
      if (error) throw error;
      if (t === "collections" && data.length) { el.className = "strip"; el.innerHTML = `<div class="track">${data.map(r => card(t, r)).join("")}</div>`; el.insertAdjacentHTML("afterend", `<a class="seemore" href="section.html?t=${t}">View all ›</a>`); startStrip(el, p.scroll_speed); continue; }
      el.innerHTML = data.length ? data.slice(0, 2).map((r, i) => render(t, r, i, o)).join("") + (data.length > 2 ? render(t, data[2], 2, o, true) : "") : '<p class="empty">Coming soon.</p>';
      if (data.length > 2) el.insertAdjacentHTML("afterend", `<a class="seemore" href="section.html?t=${t}">See more ›</a>`);
    } catch (e) { el.innerHTML = '<p class="empty">Coming soon.</p>'; } finally { reveal(); }
  }
  if (!IS_RELOAD && location.hash) $(location.hash.slice(1))?.scrollIntoView();
})();
</script></body></html>

<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin</title>
<link rel="stylesheet" href="style.css">
</head><body><div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="common.js"></script>
<script>
const app = document.getElementById("app");
const PUB = [["published", "Published", "bool"], ["sort_order", "Order (small number first)", "number"]];
const S = {
  profile: { label: "Intro", single: true, title: "name", fields: [["name", "Name", "text"], ["tagline", "Tagline", "text"], ["bio", "Bio", "area"], ["photo_url", "Photo", "image"], ["email", "Email", "text"]] },
  travel: { label: "Travel", title: "title", fields: [["title", "Title", "text"], ["location", "Place", "text"], ["country", "Country", "text"], ["visited_on", "Date", "date"], ["description", "Description", "area"], ["cover_url", "Cover photo", "image"], ["images", "More photos", "gallery"], ...PUB] },
  collections: { label: "Collection", title: "title", fields: [["title", "Title", "text"], ["category", "Category", "text"], ["description", "Description", "area"], ["image_url", "Cover photo", "image"], ["images", "More photos", "gallery"], ...PUB] },
  journal: { label: "Journal", title: "title", fields: [["title", "Title", "text"], ["written_on", "Date", "date"], ["body", "Entry", "area"], ["cover_url", "Cover photo", "image"], ["images", "More photos", "gallery"], ["published", "Published", "bool"]] },
  achievements: { label: "Achievements", title: "title", fields: [["title", "Title", "text"], ["achieved_on", "Date", "date"], ["description", "Description", "area"], ["image_url", "Cover photo", "image"], ["images", "More photos", "gallery"], ...PUB] },
  memories: { label: "Memories", title: "title", fields: [["title", "Title", "text"], ["memory_date", "Date", "date"], ["description", "Description", "area"], ["image_url", "Cover photo", "image"], ["images", "More photos", "gallery"], ...PUB] }
};
let tab = "profile";

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: a } = await sb.from("admins").select("user_id").maybeSingle();
  if (!a) { app.innerHTML = `<p>This account is not an admin.</p><div class="actions"><button id="lo">Sign out</button></div>`; lo.onclick = out; return; }
  shell();
}
async function out() { await sb.auth.signOut(); location.reload(); }

function loginView() {
  app.innerHTML = `<h2 style="font-size:32px;margin:80px 0 24px">Sign in</h2>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="actions"><button class="pri" id="go">Sign in</button></div><p class="msg" id="m"></p>`;
  go.onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if (error) m.textContent = error.message; else boot();
  };
}

function shell() {
  app.innerHTML = `<div class="bar"><b>Admin</b><span><a href="index.html" style="font-size:14px;margin-right:14px">View site</a><button id="lo">Sign out</button></span></div>
  <div class="tabs">${Object.entries(S).map(([k, v]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${v.label}</button>`).join("")}</div><div id="main"></div>`;
  lo.onclick = out;
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; shell(); });
  S[tab].single ? form(null) : list();
}

async function list() {
  const s = S[tab], main = document.getElementById("main");
  main.innerHTML = `<div class="actions" style="margin:0 0 12px"><button class="pri" id="new">+ New</button></div><div id="rows">Loading…</div>`;
  document.getElementById("new").onclick = () => form({});
  const { data, error } = await sb.from(tab).select("*").order("created_at", { ascending: false });
  const rows = document.getElementById("rows");
  if (error) { rows.textContent = error.message; return; }
  rows.innerHTML = data.length ? "" : '<p class="msg">Nothing yet.</p>';
  data.forEach(r => {
    const d = document.createElement("div"); d.className = "item";
    d.innerHTML = `<b>${esc(r[s.title])}</b>${r.published === false ? "<small>draft</small>" : ""}<button>Edit</button><button class="del">Delete</button>`;
    d.children[d.children.length - 2].onclick = () => form(r);
    d.lastChild.onclick = async () => { if (confirm("Delete this?")) { const { error } = await sb.from(tab).delete().eq("id", r.id); if (error) alert(error.message); else list(); } };
    rows.appendChild(d);
  });
}

let gal = {};
function drawGal(k) {
  const el = document.getElementById("g-" + k); el.innerHTML = "";
  gal[k].forEach((u, i) => { const d = document.createElement("div"); d.innerHTML = `<img src="${esc(u)}"><b>×</b>`; d.querySelector("b").onclick = () => { gal[k].splice(i, 1); drawGal(k); }; el.appendChild(d); });
}
async function form(row) {
  gal = {};
  const s = S[tab], main = document.getElementById("main");
  if (row === null) { const { data } = await sb.from("profile").select("*").eq("id", 1).maybeSingle(); row = data || { id: 1 }; }
  main.innerHTML = s.fields.map(([k, l, t]) => {
    const v = row[k];
    if (t === "area") return `<label>${l}</label><textarea data-k="${k}">${esc(v)}</textarea>`;
    if (t === "bool") return `<label class="chk"><input type="checkbox" data-k="${k}" ${v === false ? "" : "checked"}> ${l}</label>`;
    if (t === "image") return `<label>${l}</label><input type="file" accept="image/*" data-up="${k}"><input type="hidden" data-k="${k}" value="${esc(v)}">${v ? `<img class="pv" src="${esc(v)}">` : ""}`;
    if (t === "gallery") { gal[k] = [...(v || [])]; return `<label>${l}</label><input type="file" accept="image/*" multiple data-gup="${k}"><div class="thumbs" id="g-${k}"></div>`; }
    return `<label>${l}</label><input data-k="${k}" type="${t}" value="${esc(v)}">`;
  }).join("") + `<div class="actions"><button class="pri" id="save">Save</button>${s.single ? "" : '<button id="cancel">Cancel</button>'}</div><p class="msg" id="m"></p>`;
  if (!s.single) cancel.onclick = list;
  Object.keys(gal).forEach(drawGal);
  main.querySelectorAll("[data-gup]").forEach(inp => inp.onchange = async () => {
    const k = inp.dataset.gup;
    for (const f of inp.files) {
      m.textContent = "Uploading " + f.name + "…";
      const path = `${tab}/${Date.now()}-${f.name.replace(/[^\w.\-]/g, "_")}`;
      const { error } = await sb.storage.from("media").upload(path, f);
      if (error) { m.textContent = error.message; return; }
      gal[k].push(sb.storage.from("media").getPublicUrl(path).data.publicUrl); drawGal(k);
    }
    inp.value = ""; m.textContent = "Photos ready. Press Save.";
  });
  main.querySelectorAll("[data-up]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    m.textContent = "Uploading…";
    const path = `${tab}/${Date.now()}-${f.name.replace(/[^\w.\-]/g, "_")}`;
    const { error } = await sb.storage.from("media").upload(path, f);
    if (error) { m.textContent = error.message; return; }
    const url = sb.storage.from("media").getPublicUrl(path).data.publicUrl;
    main.querySelector(`[data-k="${inp.dataset.up}"]`).value = url;
    m.textContent = "Photo ready. Press Save.";
  });
  save.onclick = async () => {
    const o = {};
    main.querySelectorAll("[data-k]").forEach(e => {
      const k = e.dataset.k, t = s.fields.find(f => f[0] === k)[2];
      o[k] = t === "bool" ? e.checked : t === "number" ? (e.value === "" ? 0 : +e.value) : (e.value === "" && t !== "text" && t !== "area" ? null : e.value);
    });
    s.fields.filter(f => f[2] === "gallery").forEach(f => o[f[0]] = gal[f[0]]);
    if (s.single) o.id = 1;
    else if (row.id) o.id = row.id;
    o.title === "" && (m.textContent = "Title is required.");
    if (!s.single && !o.title) return;
    if (s.single) o.updated_at = new Date().toISOString();
    const { error } = await sb.from(tab).upsert(o);
    if (error) m.textContent = error.message;
    else if (s.single) m.textContent = "Saved."; else list();
  };
}
boot();
</script></body></html>

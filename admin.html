<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin</title>
<link rel="stylesheet" href="style.css">
</head><body><div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="common.js"></script>
<script>
const app = document.getElementById("app"), MAXPICS = 20;
const PUB = [["published", "Published", "bool"], ["sort_order", "Order (small number first)", "number"]];
const GAL = ["images", "More photos (max 20, each with a short description)", "gallery"];
const S = {
  intro: { label: "Intro", table: "profile", single: true, fields: [["name", "Name", "text"], ["tagline", "Tagline", "text"], ["bio", "Short bio", "area"], ["hero_url", "Header photo (full screen)", "image"]] },
  contact: { label: "Contact", table: "profile", single: true, fields: [["email", "Email", "text"], ["phone", "Phone", "text"], ["address", "Address", "text"], ["whatsapp", "WhatsApp (number or link)", "text"], ["instagram", "Instagram link", "text"], ["facebook", "Facebook link", "text"], ["linkedin", "LinkedIn link", "text"]] },
  design: { label: "Design", table: "profile", single: true, fields: [
    ["img_radius", "Picture corner roundness (0 = square, 60 = very round)", "number"],
    ["side_mode", "Picture side", "select", [["alternate", "Alternate left / right"], ["left", "Always left"], ["right", "Always right"]]],
    ["text_color", "Text color", "color"],
    ["font_family", "Font", "select", [["system", "System (Apple style)"], ["inter", "Inter"], ["playfair", "Playfair Display (serif)"], ["poppins", "Poppins"], ["montserrat", "Montserrat"], ["lora", "Lora (serif)"]]],
    ["font_size", "Font size in px (14 to 22)", "number"]] },
  travel: { label: "Travel", title: "title", fields: [["title", "Title", "text"], ["location", "Place", "text"], ["country", "Country", "text"], ["visited_on", "Date", "date"], ["description", "Description", "area"], ["cover_url", "Cover photo", "image"], GAL, ...PUB] },
  collections: { label: "Collection", title: "title", fields: [["title", "Title", "text"], ["category", "Category", "text"], ["description", "Description", "area"], ["image_url", "Cover photo", "image"], GAL, ...PUB] },
  journal: { label: "Journal", title: "title", fields: [["title", "Title", "text"], ["written_on", "Date", "date"], ["body", "Entry", "area"], ["cover_url", "Cover photo", "image"], GAL, ["published", "Published", "bool"]] },
  achievements: { label: "Achievements", title: "title", fields: [["title", "Title", "text"], ["achieved_on", "Date", "date"], ["description", "Description", "area"], ["image_url", "Cover photo", "image"], GAL, ...PUB] },
  memories: { label: "Memories", title: "title", fields: [["title", "Title", "text"], ["memory_date", "Date", "date"], ["description", "Description", "area"], ["image_url", "Cover photo", "image"], GAL, ...PUB] },
  messages: { label: "Messages", readonly: true }
};
let tab = "intro", gal = {};

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: a } = await sb.from("admins").select("user_id").maybeSingle();
  if (!a) { app.innerHTML = `<p>This account is not an admin.</p><div class="actions"><button id="lo">Sign out</button></div>`; lo.onclick = out; return; }
  shell();
}
async function out() { await sb.auth.signOut(); location.reload(); }
function loginView() {
  app.innerHTML = `<h2 style="font-size:32px;margin:80px 0 24px">Sign in</h2>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="actions"><button class="pri" id="go">Sign in</button></div><p class="msg" id="m"></p>`;
  go.onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if (error) m.textContent = error.message; else boot();
  };
}
function shell() {
  app.innerHTML = `<div class="bar"><b>Admin</b><span><a href="index.html" style="font-size:14px;margin-right:14px">View site</a><button id="lo">Sign out</button></span></div>
  <div class="tabs">${Object.entries(S).map(([k, v]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${v.label}</button>`).join("")}</div><div id="main"></div>`;
  lo.onclick = out;
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; shell(); });
  const s = S[tab];
  s.readonly ? inbox() : s.single ? form(null) : list();
}
async function inbox() {
  const main = document.getElementById("main"); main.textContent = "Loading…";
  const { data, error } = await sb.from("messages").select("*").order("created_at", { ascending: false });
  if (error) { main.textContent = error.message; return; }
  main.innerHTML = data.length ? "" : '<p class="msg">No messages yet.</p>';
  data.forEach(r => {
    const d = document.createElement("div"); d.className = "msgbox";
    d.innerHTML = `<b>${esc(r.name)}</b> <small>${esc(r.email)} · ${esc(new Date(r.created_at).toLocaleString())}</small><p>${esc(r.message)}</p><button class="del">Delete</button>`;
    d.querySelector("button").onclick = async () => { if (confirm("Delete this message?")) { await sb.from("messages").delete().eq("id", r.id); inbox(); } };
    main.appendChild(d);
  });
}
async function list() {
  const s = S[tab], main = document.getElementById("main");
  main.innerHTML = `<div class="actions" style="margin:0 0 12px"><button class="pri" id="new">+ New</button></div><div id="rows">Loading…</div>`;
  document.getElementById("new").onclick = () => form({});
  const { data, error } = await sb.from(tab).select("*").order("created_at", { ascending: false });
  const rows = document.getElementById("rows");
  if (error) { rows.textContent = error.message; return; }
  rows.innerHTML = data.length ? "" : '<p class="msg">Nothing yet.</p>';
  data.forEach(r => {
    const d = document.createElement("div"); d.className = "item";
    d.innerHTML = `<b>${esc(r[s.title])}</b>${r.published === false ? "<small>draft</small>" : ""}<button>Edit</button><button class="del">Delete</button>`;
    d.children[d.children.length - 2].onclick = () => form(r);
    d.lastChild.onclick = async () => { if (confirm("Delete this?")) { const { error } = await sb.from(tab).delete().eq("id", r.id); if (error) alert(error.message); else list(); } };
    rows.appendChild(d);
  });
}
function drawGal(k) {
  const el = document.getElementById("g-" + k); el.innerHTML = "";
  gal[k].forEach((it, i) => {
    const d = document.createElement("div"); d.className = "gi";
    d.innerHTML = `<img src="${esc(it.url)}"><input placeholder="Short description (optional)" maxlength="200"><b>×</b>`;
    const inp = d.querySelector("input"); inp.value = it.caption || ""; inp.oninput = () => it.caption = inp.value;
    d.querySelector("b").onclick = () => { gal[k].splice(i, 1); drawGal(k); };
    el.appendChild(d);
  });
  const c = document.getElementById("gc-" + k); if (c) c.textContent = `${gal[k].length} / ${MAXPICS} photos`;
}
async function upload(f) {
  const path = `${tab}/${Date.now()}-${f.name.replace(/[^\w.\-]/g, "_")}`;
  const { error } = await sb.storage.from("media").upload(path, f);
  if (error) throw error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}
async function form(row) {
  const s = S[tab], tb = s.table || tab, main = document.getElementById("main"); gal = {};
  if (row === null) { const { data } = await sb.from("profile").select("*").eq("id", 1).maybeSingle(); row = data || { id: 1 }; }
  main.innerHTML = s.fields.map(([k, l, t, opts]) => {
    const v = row[k];
    if (t === "area") return `<label>${l}</label><textarea data-k="${k}">${esc(v)}</textarea>`;
    if (t === "bool") return `<label class="chk"><input type="checkbox" data-k="${k}" ${v === false ? "" : "checked"}> ${l}</label>`;
    if (t === "select") return `<label>${l}</label><select data-k="${k}">${opts.map(([o, n]) => `<option value="${o}" ${o === v ? "selected" : ""}>${n}</option>`).join("")}</select>`;
    if (t === "color") return `<label>${l}</label><input type="color" data-k="${k}" value="${/^#[0-9a-f]{6}$/i.test(v || "") ? v : "#1d1d1f"}">`;
    if (t === "image") return `<label>${l}</label><input type="file" accept="image/*" data-up="${k}"><input type="hidden" data-k="${k}" value="${esc(v)}">${v ? `<img class="pv" src="${esc(v)}">` : ""}`;
    if (t === "gallery") { gal[k] = Array.isArray(v) ? v.filter(i => i && i.url).map(i => ({ url: i.url, caption: i.caption || "" })) : []; return `<label>${l} <span id="gc-${k}"></span></label><input type="file" accept="image/*" multiple data-gup="${k}"><div class="thumbs" id="g-${k}"></div>`; }
    return `<label>${l}</label><input data-k="${k}" type="${t}" value="${esc(v)}">`;
  }).join("") + `<div class="actions"><button class="pri" id="save">Save</button>${s.single ? "" : '<button id="cancel">Cancel</button>'}</div><p class="msg" id="m"></p>`;
  if (!s.single) cancel.onclick = list;
  Object.keys(gal).forEach(drawGal);
  main.querySelectorAll("[data-gup]").forEach(inp => inp.onchange = async () => {
    const k = inp.dataset.gup, files = [...inp.files], room = MAXPICS - gal[k].length;
    if (files.length > room) m.textContent = `Only ${MAXPICS} photos allowed. Uploading the first ${Math.max(room, 0)}…`;
    try {
      for (const f of files.slice(0, Math.max(room, 0))) { m.textContent = "Uploading " + f.name + "…"; gal[k].push({ url: await upload(f), caption: "" }); drawGal(k); }
      m.textContent = "Photos ready. Add short descriptions, then press Save.";
    } catch (e) { m.textContent = e.message; }
    inp.value = "";
  });
  main.querySelectorAll("[data-up]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    m.textContent = "Uploading…";
    try {
      main.querySelector(`[data-k="${inp.dataset.up}"]`).value = await upload(f);
      m.textContent = "Photo ready. Press Save.";
    } catch (e) { m.textContent = e.message; }
  });
  save.onclick = async () => {
    const o = {};
    main.querySelectorAll("[data-k]").forEach(e => {
      const k = e.dataset.k, t = s.fields.find(f => f[0] === k)[2];
      o[k] = t === "bool" ? e.checked : t === "number" ? (e.value === "" ? null : +e.value) : (e.value === "" && ["date", "image"].includes(t) ? null : e.value);
    });
    s.fields.filter(f => f[2] === "gallery").forEach(f => o[f[0]] = gal[f[0]].slice(0, MAXPICS));
    s.fields.filter(f => f[2] === "number" && o[f[0]] === null).forEach(f => delete o[f[0]]);
    if (s.single) { o.id = 1; o.updated_at = new Date().toISOString(); }
    else { if (!o.title) { m.textContent = "Title is required."; return; } if (row.id) o.id = row.id; }
    const { error } = await sb.from(tb).upsert(o);
    if (error) m.textContent = error.message;
    else if (s.single) m.textContent = "Saved."; else list();
  };
}
boot();
</script></body></html>

<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin</title>
<link rel="stylesheet" href="style.css?v=4">
</head><body><div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=4"></script><script src="common.js?v=4"></script>
<script>
const app = document.getElementById("app"), MAXPICS = 20, VERSION = "v4";
const PUB = [{ k: "published", l: "Published", t: "bool" }, { k: "sort_order", l: "Order (small number first)", t: "number" }];
const GAL = { k: "images", l: "Sub photos (max 20). Each has its own description and text style", t: "gallery" };
const F = (k, l, t, extra) => Object.assign({ k, l, t }, extra);
const TX = (k, l, extra) => F(k, l, "text", Object.assign({ sty: true }, extra));
const AR = (k, l, extra) => F(k, l, "area", Object.assign({ sty: true }, extra));
const S = {
  intro: { label: "Intro / Hero", table: "profile", single: true, fields: [
    TX("name", "Name", { sk: "hero.name" }), TX("tagline", "Tagline", { sk: "hero.tagline" }),
    AR("hero_cap1", "Caption 1", { sk: "hero.cap1" }), AR("hero_cap2", "Caption 2", { sk: "hero.cap2" }),
    F("hero_url", "Header photo (full screen)", "image")] },
  logo: { label: "Logo", table: "profile", single: true, fields: [
    F("logo_url", "Logo (top-left of the website; clicking it goes to the home hero)", "image"),
    F("logo_h", "Logo height in px (16 to 120)", "number")] },
  about: { label: "About me", table: "profile", single: true, fields: [
    TX("about_title", "Small title above (e.g. About me)", { sk: "about.title" }),
    TX("about_headline", "Headline (one strong sentence)", { sk: "about.headline" }),
    AR("about_bio", "Bio (your story; blank line between paragraphs)", { sk: "about.bio" }),
    AR("about_facts", "Quick facts, one per line like: Based in | Dhaka", { sk: "about.facts", hint: "Examples: Born | 2000, Education | BBA, Business | Retail" }),
    F("about_pic", "Big photo", "image"),
    F("about_height", "Photo height", "select", { opts: [["50", "Half screen"], ["60", "A little more than half"], ["80", "Large"], ["100", "Full screen"]] }),
    F("about_side", "Photo side", "select", { opts: [["left", "Left"], ["right", "Right"]] }),
    F("about_valign", "Photo vertical position", "select", { opts: [["start", "Top"], ["center", "Middle"], ["end", "Bottom"]] }),
    F("about_radius", "Photo corner roundness (0 to 80)", "number"),
    TX("about_docs_title", "Title above licenses (e.g. Licenses & Credentials)", { sk: "about.docs_title" }),
    F("about_docs", "Business licenses and certificates (max 20, each with a description)", "gallery")] },
  contacts: { label: "Contact", title: "title", sub: "value", order: ["sort_order", true], fields: [
    F("title", "Title (e.g. YouTube)", "text"), F("value", "Link, email, phone or address", "text", { hint: "A link opens as a link. An email or phone number is clickable. Anything else is shown as text." }),
    F("icon", "App icon", "select", { opts: Object.entries(ICON_NAMES) }), ...PUB] },
  travel: { label: "Travel", title: "title", fields: [TX("title", "Cover title"), F("location", "Place", "text"), F("country", "Country", "text"), F("visited_on", "Date", "date"), AR("description", "Cover description"), F("cover_url", "Cover photo (shown full screen)", "image"), GAL, ...PUB], styled: true },
  collections: { label: "Collection", title: "title", fields: [TX("title", "Group title (e.g. Watches)"), F("category", "Category label", "text"), AR("description", "Group description"), F("image_url", "Cover photo (shown full screen)", "image"), GAL, ...PUB], styled: true },
  journal: { label: "Journal", title: "title", fields: [TX("title", "Title"), F("written_on", "Date", "date"), AR("body", "Entry"), F("cover_url", "Cover photo", "image"), GAL, { k: "published", l: "Published", t: "bool" }], styled: true },
  achievements: { label: "Achievements", title: "title", fields: [TX("title", "Cover title"), F("achieved_on", "Date", "date"), AR("description", "Cover description"), F("image_url", "Cover photo (shown full screen)", "image"), GAL, ...PUB], styled: true },
  memories: { label: "Memories", title: "title", fields: [TX("title", "Cover title"), F("memory_date", "Date", "date"), AR("description", "Cover description"), F("image_url", "Cover photo (shown full screen)", "image"), GAL, ...PUB], styled: true },
  pages: { label: "Section pages", table: "section_pages", pk: "key", title: "title", order: ["key", true], nonew: true, nodel: true, noreq: true, styled: true, fields: [
    TX("title", "Page title (also the section name on the home page)"), AR("description", "Page description (shown under the full-screen cover)"), F("cover_url", "Full-screen cover photo for this page", "image")] },
  design: { label: "Pictures", table: "profile", single: true, fields: [
    F("img_radius", "Picture corner roundness (0 = square, 60 = very round)", "number"),
    F("img_ratio", "Picture shape", "select", { opts: [["portrait", "Tall (4:5)"], ["square", "Square"], ["landscape", "Landscape (4:3)"], ["wide", "Wide (16:9)"]] }),
    F("side_mode", "Picture side in lists", "select", { opts: [["alternate", "Alternate left / right"], ["left", "Always left"], ["right", "Always right"]] })] },
  messages: { label: "Messages", readonly: true }
};
let tab = "intro", gal = {}, stys = {};

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: a } = await sb.from("admins").select("user_id").maybeSingle();
  if (!a) { app.innerHTML = `<p>This account is not an admin.</p><div class="actions"><button id="lo">Sign out</button></div>`; $("lo").onclick = out; return; }
  shell();
}
async function out() { await sb.auth.signOut(); location.reload(); }
function loginView() {
  app.innerHTML = `<h2 style="font-size:32px;margin:80px 0 24px">Sign in</h2>
  <label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="actions"><button class="pri" id="go">Sign in</button></div><p class="msg" id="m"></p>`;
  $("go").onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value }); if (error) $("m").textContent = error.message; else boot(); };
}
function shell() {
  app.innerHTML = `<div class="bar"><b>Admin <small style="color:var(--mut);font-weight:400">${VERSION}</small></b><span><a href="index.html" style="font-size:14px;margin-right:14px">View site</a><button id="lo">Sign out</button></span></div>
  <div class="tabs">${Object.entries(S).map(([k, v]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${v.label}</button>`).join("")}</div><div id="main"></div>`;
  $("lo").onclick = out;
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; shell(); });
  const s = S[tab]; s.readonly ? inbox() : s.single ? form(null) : list();
}
async function inbox() {
  const main = $("main"); main.textContent = "Loading…";
  const { data, error } = await sb.from("messages").select("*").order("created_at", { ascending: false });
  if (error) { main.textContent = error.message; return; }
  main.innerHTML = data.length ? "" : '<p class="msg">No messages yet.</p>';
  data.forEach(r => {
    const d = document.createElement("div"); d.className = "msgbox";
    d.innerHTML = `<b>${esc(r.name)}</b> <small>${esc(r.email)} · ${esc(new Date(r.created_at).toLocaleString())}</small><p>${esc(r.message)}</p><button class="del">Delete</button>`;
    d.querySelector("button").onclick = async () => { if (confirm("Delete this message?")) { await sb.from("messages").delete().eq("id", r.id); inbox(); } };
    main.appendChild(d);
  });
}
async function list() {
  const s = S[tab], pk = s.pk || "id", main = $("main"), ord = s.order || ["created_at", false];
  main.innerHTML = `${s.nonew ? "" : '<div class="actions" style="margin:0 0 12px"><button class="pri" id="new">+ New</button></div>'}<div id="rows">Loading…</div>`;
  if (!s.nonew) $("new").onclick = () => form({});
  const { data, error } = await sb.from(s.table || tab).select("*").order(ord[0], { ascending: ord[1] });
  const rows = $("rows");
  if (error) { rows.textContent = error.message; return; }
  rows.innerHTML = data.length ? "" : '<p class="msg">Nothing yet.</p>';
  data.forEach(r => {
    const d = document.createElement("div"); d.className = "item";
    d.innerHTML = `<b>${esc(r[s.title] || r[pk])}${s.sub ? ` <small>${esc(r[s.sub])}</small>` : ""}</b>${r.published === false ? "<small>draft</small>" : ""}<button>Edit</button>${s.nodel ? "" : '<button class="del">Delete</button>'}`;
    d.querySelector("button").onclick = () => form(r);
    const del = d.querySelector(".del"); if (del) del.onclick = async () => { if (confirm("Delete this?")) { const { error } = await sb.from(s.table || tab).delete().eq(pk, r[pk]); if (error) alert(error.message); else list(); } };
    rows.appendChild(d);
  });
}
/* ---- per-text style editor ---- */
function styleEditor(st) {
  const dt = document.createElement("details"); dt.className = "sted";
  const nm = (f, l) => `<label>${l}<input type="number" data-f="${f}" placeholder="auto"></label>`;
  dt.innerHTML = `<summary>Text style (font, size, color, alignment, spacing)</summary><div class="sgrid">
    <label>Font<select data-f="font"><option value="">Default</option>${fontOpts()}</select></label>${nm("size", "Size (px)")}
    <label>Color<input type="color" data-f="color" value="#1d1d1f"></label>
    <label>Alignment<select data-f="align"><option value="">Default</option><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></label>
    ${nm("pad", "Padding (px)")}${nm("mt", "Margin top (px)")}${nm("mb", "Margin bottom (px)")}</div><button type="button" class="rs">Reset text style</button>`;
  const fill = () => dt.querySelectorAll("[data-f]").forEach(e => { const v = st[e.dataset.f]; e.value = v !== undefined ? v : e.dataset.f === "color" ? "#1d1d1f" : ""; });
  fill();
  dt.querySelectorAll("[data-f]").forEach(e => { const h = () => { const f = e.dataset.f; if (e.value === "") delete st[f]; else st[f] = e.type === "number" ? +e.value : e.value; }; e.oninput = h; e.onchange = h; });
  dt.querySelector(".rs").onclick = () => { Object.keys(st).forEach(k => delete st[k]); fill(); };
  return dt;
}
function drawGal(k) {
  const el = $("g-" + k); el.innerHTML = "";
  gal[k].forEach((it, i) => {
    const d = document.createElement("div"); d.className = "gi";
    d.innerHTML = `<img src="${esc(it.url)}"><textarea placeholder="Description of this photo"></textarea><div class="x">×</div><div class="gs"></div>`;
    const ta = d.querySelector("textarea"); ta.value = it.caption || ""; ta.oninput = () => it.caption = ta.value;
    d.querySelector(".x").onclick = () => { gal[k].splice(i, 1); drawGal(k); };
    d.querySelector(".gs").appendChild(styleEditor(it.style = it.style || {}));
    el.appendChild(d);
  });
  const c = $("gc-" + k); if (c) c.textContent = `(${gal[k].length} / ${MAXPICS})`;
}
async function upload(f) {
  const path = `${tab}/${Date.now()}-${f.name.replace(/[^\w.\-]/g, "_")}`;
  const { error } = await sb.storage.from("media").upload(path, f);
  if (error) throw error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}
async function form(row) {
  const s = S[tab], tb = s.table || tab, pk = s.pk || "id", main = $("main"); gal = {}; stys = {};
  if (row === null) { const { data } = await sb.from("profile").select("*").eq("id", 1).maybeSingle(); row = data || { id: 1 }; }
  const saved = row.styles || {};
  main.innerHTML = s.fields.map(f => {
    const v = row[f.k], k = f.k, l = f.l, t = f.t;
    const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : "", sk = f.sk || f.k;
    const stySlot = f.sty ? `<div data-sty="${esc(sk)}"></div>` : "";
    if (t === "area") return `<label>${l}</label><textarea data-k="${k}">${esc(v)}</textarea>${hint}${stySlot}`;
    if (t === "bool") return `<label class="chk"><input type="checkbox" data-k="${k}" ${v === false ? "" : "checked"}> ${l}</label>`;
    if (t === "select") return `<label>${l}</label><select data-k="${k}">${f.opts.map(([o, n]) => `<option value="${esc(o)}" ${String(o) === String(v) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`;
    if (t === "image") return `<label>${l}</label><input type="file" accept="image/*" data-up="${k}"><input type="hidden" data-k="${k}" value="${esc(v)}"><div id="pv-${k}">${v ? `<img class="pv" src="${esc(v)}"> <button type="button" class="del" data-rm="${k}" style="margin-top:6px">Remove photo</button>` : ""}</div>`;
    if (t === "gallery") { gal[k] = Array.isArray(v) ? v.filter(i => i && i.url).map(i => ({ url: i.url, caption: i.caption || "", style: Object.assign({}, i.style) })) : []; return `<label>${l} <b id="gc-${k}"></b></label><input type="file" accept="image/*" multiple data-gup="${k}"><div id="g-${k}"></div>`; }
    return `<label>${l}</label><input data-k="${k}" type="${t}" value="${esc(v)}">${hint}${stySlot}`;
  }).join("") + `<div class="actions"><button class="pri" id="save">Save</button>${s.single ? "" : '<button id="cancel">Cancel</button>'}</div><p class="msg" id="m"></p>`;
  if (!s.single) $("cancel").onclick = list;
  main.querySelectorAll("[data-sty]").forEach(ph => { const sk = ph.dataset.sty; ph.appendChild(styleEditor(stys[sk] = Object.assign({}, saved[sk]))); });
  Object.keys(gal).forEach(drawGal);
  main.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { const k = b.dataset.rm; main.querySelector(`[data-k="${k}"]`).value = ""; $("pv-" + k).innerHTML = ""; $("m").textContent = "Photo removed. Press Save."; });
  main.querySelectorAll("[data-gup]").forEach(inp => inp.onchange = async () => {
    const k = inp.dataset.gup, files = [...inp.files], room = Math.max(0, MAXPICS - gal[k].length);
    if (files.length > room) $("m").textContent = `Only ${MAXPICS} photos are allowed. Uploading the first ${room}…`;
    try { for (const f of files.slice(0, room)) { $("m").textContent = "Uploading " + f.name + "…"; gal[k].push({ url: await upload(f), caption: "", style: {} }); drawGal(k); } $("m").textContent = "Photos ready. Add descriptions, then press Save."; }
    catch (e) { $("m").textContent = e.message; }
    inp.value = "";
  });
  main.querySelectorAll("[data-up]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return; $("m").textContent = "Uploading…";
    try { const u = await upload(f), k = inp.dataset.up; main.querySelector(`[data-k="${k}"]`).value = u; $("pv-" + k).innerHTML = `<img class="pv" src="${esc(u)}">`; $("m").textContent = "Photo ready. Press Save."; }
    catch (e) { $("m").textContent = e.message; }
  });
  $("save").onclick = async () => {
    const o = {};
    main.querySelectorAll("[data-k]").forEach(e => {
      const k = e.dataset.k, t = s.fields.find(f => f.k === k).t;
      o[k] = t === "bool" ? e.checked : t === "number" ? (e.value === "" ? null : +e.value) : (e.value === "" && ["date", "image"].includes(t) ? null : e.value);
    });
    s.fields.filter(f => f.t === "gallery").forEach(f => o[f.k] = gal[f.k].slice(0, MAXPICS));
    s.fields.filter(f => f.t === "number" && o[f.k] === null).forEach(f => delete o[f.k]);
    if (Object.keys(stys).length) o.styles = Object.assign({}, saved, stys);
    if (s.single) { o.id = 1; o.updated_at = new Date().toISOString(); }
    else { if (!s.noreq && !o[s.title]) { $("m").textContent = "Title is required."; return; } if (row[pk]) o[pk] = row[pk]; }
    const { error } = await sb.from(tb).upsert(o);
    if (error) $("m").textContent = error.message; else if (s.single) $("m").textContent = "Saved."; else list();
  };
}
boot();
</script></body></html>
